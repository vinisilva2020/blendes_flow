name: blendesflow

services:
  database:
    image: postgres:17.10-alpine3.24
    pull_policy: weekly
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ./.env
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true

  cache:
    image: redis:7.4.2-alpine3.21
    pull_policy: weekly
    restart: unless-stopped
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /data:size=16m,mode=1777

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      pull: true
    image: blendesflow-backend:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ./.env
    environment:
      CACHE_URL: ${CACHE_URL:-redis://cache:6379/1}
    expose:
      - "8000"
    volumes:
      - type: volume
        source: django_static
        target: /var/www/static
      - type: volume
        source: django_media
        target: /var/www/media
    networks:
      - edge
      - data
    depends_on:
      database:
        condition: service_healthy
        restart: true
        required: true
      cache:
        condition: service_healthy
        restart: true
        required: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      pull: true
      args:
        VITE_API_BASE_URL: /api
        GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    image: blendesflow-nginx:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - name: http
        target: 8080
        published: "80"
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: http
        mode: ingress
    volumes:
      - type: volume
        source: django_static
        target: /var/www/static
        read_only: true
      - type: volume
        source: django_media
        target: /var/www/media
        read_only: true
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
        restart: true
        required: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  django_static:
  django_media:
