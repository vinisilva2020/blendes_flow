components:
  schemas:
    APIErrorBodySerializerV1:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        details:
          readOnly: true
          nullable: true
      required:
        - code
        - details
        - message
    APIErrorSerializerV1:
      type: object
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/APIErrorBodySerializerV1'
          readOnly: true
      required:
        - error
    AccountGoogleSocialAccountInputSerializerV1:
      type: object
      properties:
        credential:
          type: string
          writeOnly: true
      required:
        - credential
    AccountOutputSerializerV1:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        email:
          type: string
          format: email
          readOnly: true
        avatar_type:
          type: string
          readOnly: true
          nullable: true
        social_accounts:
          type: array
          items:
            $ref: '#/components/schemas/SocialAccountOutputSerializerV1'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Data de registro
      required:
        - avatar_type
        - date_joined
        - email
        - id
        - is_active
        - social_accounts
        - username
    AccountPasswordInputSerializerV1:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          maxLength: 128
      required:
        - new_password
        - password_confirm
    AccountRegistrationInputSerializerV1:
      type: object
      properties:
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          maxLength: 128
        avatar_type:
          type: string
          nullable: true
          maxLength: 64
      required:
        - email
        - password
        - password_confirm
        - username
    AuthenticationOutputSerializerV1:
      type: object
      description: Serializa os dados de autenticação para a resposta da API.
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        token_type:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_expires_at:
          type: string
          format: date-time
          readOnly: true
        session_id:
          type: string
          format: uuid
          readOnly: true
      required:
        - access_expires_in
        - access_token
        - refresh_expires_at
        - refresh_token
        - session_id
        - token_type
    AuthenticationSessionOutputSerializerV1:
      type: object
      description: Serializa os dados de uma sessão de autenticação ativa.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        is_current:
          type: boolean
          description: Indica se esta sessão é a sessão atual do usuário.
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - created_at
        - id
        - is_current
    BlaveInputSerializerV1:
      type: object
      description: Valida os dados usados no cadastro de uma blave.
      properties:
        title:
          type: string
          maxLength: 255
        is_favorite:
          type: boolean
      required:
        - title
    BlaveMovementOutputSerializerV1:
      type: object
      description: Serializa o estado de um movimento da blave.
      properties:
        id:
          type: integer
          readOnly: true
        movement:
          $ref: '#/components/schemas/MovementEnum'
        status:
          $ref: '#/components/schemas/BlaveMovementOutputSerializerV1StatusEnum'
        completed_at:
          type: string
          format: date-time
          nullable: true
        reopen_at:
          type: string
          format: date
          nullable: true
      required:
        - id
        - movement
    BlaveMovementOutputSerializerV1StatusEnum:
      enum:
        - LOCKED
        - ACTIVE
        - COMPLETED
        - INVALIDATED
      type: string
      description: |-
        * `LOCKED` - Bloqueado
        * `ACTIVE` - Ativo
        * `COMPLETED` - Concluido
        * `INVALIDATED` - Invalidado
    BlaveOutputSerializerV1:
      type: object
      description: Serializa uma blave com seus movimentos de navegacao.
      properties:
        id:
          type: integer
          readOnly: true
        organization:
