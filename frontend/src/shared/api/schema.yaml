  /api/v1/accounts/:
    post:
      operationId: v1_accounts_create
      description: Register a local user account.
      tags:
        - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegistrationInputSerializerV1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRegistrationInputSerializerV1'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRegistrationInputSerializerV1'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOutputSerializerV1'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSerializerV1'
          description: ''
        '409':
          content:
